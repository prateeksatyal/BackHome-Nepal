name: backhome_nepal
description: Premium AI-powered mobile app for NRNs and returnees to Nepal.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  go_router: ^14.0.0
  provider: ^6.0.0
  
  # State Management
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # Firebase
  firebase_core: ^24.0.0
  firebase_auth: ^4.10.0
  firebase_firestore: ^4.13.0
  firebase_storage: ^11.2.0
  firebase_messaging: ^14.6.0
  
  # Networking & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Google Maps & Location
  google_maps_flutter: ^2.4.0
  geolocator: ^10.0.0
  
  # AI & NLP
  google_generative_ai: ^0.3.0
  
  # Date & Time
  intl: ^0.19.0
  
  # UI Components
  cached_network_image: ^3.3.0
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  
  # Animations
  lottie: ^3.1.0
  
  # Audio & Notifications
  just_audio: ^0.9.0
  local_notifications: ^0.7.0
  
  # Sensors & Health
  health: ^9.0.0
  
  # Utils
  logger: ^2.0.0
  get_it: ^7.6.0
  equatable: ^2.0.5
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
